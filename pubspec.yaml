name: guardian_circle
description: Context-aware safety monitoring app for elderly users — caregiver companion.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # BLE (wearable connectivity)
  flutter_blue_plus: ^1.32.12

  # Maps & location
  google_maps_flutter: ^2.7.0
  geolocator: ^12.0.0
  geofence_service: ^6.0.0+1

  # Networking (risk-engine / backend polling)
  dio: ^5.5.0
  web_socket_channel: ^2.4.5   # live risk-level + event stream
  retrofit: ^4.1.0
  json_annotation: ^4.9.0

  # Local persistence (cached trips, last-known state)
  hive_flutter: ^1.1.0

  # Push notifications (FCM per architecture doc)
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.0

  # UI / UX
  google_fonts: ^6.2.1
  intl: ^0.19.0
  flutter_svg: ^2.0.10
  fl_chart: ^0.68.0            # timeline / battery graphs
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0         # "Call" quick action
  vibration: ^3.2.1            # local feedback mirroring band vibration

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  json_serializable: ^6.8.0
  retrofit_generator: ^8.1.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/